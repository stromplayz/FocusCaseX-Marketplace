<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FocusCaseX logo">
  <!-- FocusCaseX original mark: hexagonal case + focus F + link node -->
  <defs>
    <linearGradient id="fcxCase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d232c"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <linearGradient id="fcxEm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- hexagon case -->
  <path d="M256 40 L442 148 L442 364 L256 472 L70 364 L70 148 Z"
        fill="url(#fcxCase)" stroke="#2a323e" stroke-width="10"/>

  <!-- stylized F with link node -->
  <g fill="none" stroke="url(#fcxEm)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 352 L186 176 L330 176"/>
    <path d="M186 252 L292 252"/>
  </g>
  <circle cx="330" cy="176" r="30" fill="url(#fcxEm)"/>
  <circle cx="292" cy="252" r="18" fill="url(#fcxEm)" opacity="0.85"/>
  <circle cx="330" cy="176" r="52" fill="none" stroke="url(#fcxEm)" stroke-width="12" opacity="0.35"/>
</svg>
